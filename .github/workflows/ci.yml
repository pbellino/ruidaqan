name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint, tests y docs (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10"] # Simplificado a 3.10 para consistencia con el deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Permite que Sphinx lea el hash de Git para la versión

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # Instalamos dev (tests) y docs para validar que conf.py funcione
          pip install -e ".[dev,docs]"

      - name: Validar compilación de documentación
        run: |
          # Esto detectará errores en conf.py o dependencias faltantes
          sphinx-build -W docs docs/_build/html 

      - name: Correr tests
        env:
          RUIDAQAN_DEBUG_MODE: "True"
        run: pytest --tb=short -q

      - name: Reporte de cobertura
        run: pytest --cov=src/ruidaqan --cov-report=xml -q
        env:
          RUIDAQAN_DEBUG_MODE: "True"

name: Publicar release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  # ── 1. Tests ─────────────────────────────────────────────────────────────
  test:
    name: Tests pre-publicación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        env:
          RUIDAQAN_DEBUG_MODE: "True"
        run: pytest --tb=short -q

  # ── 2. Build wheel y sdist ───────────────────────────────────────────────
  build-wheel:
    name: Build wheel y sdist
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar paquete y herramientas
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build,docs]"

      - name: Stampar commit hash
        run: |
          HASH=$(git rev-parse --short HEAD)
          sed -i 's/^__commit__ =.*/__commit__ = "'"$HASH"'"/' src/ruidaqan/__init__.py

      - name: Generar documentación
        run: sphinx-build docs docs/_build/html

      - name: Copiar docs al paquete
        run: |
          mkdir -p src/ruidaqan/docs/html
          cp -r docs/_build/html/* src/ruidaqan/docs/html/

      - name: Build
        run: python -m build

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/

  # ── 3. Ejecutables Linux ─────────────────────────────────────────────────
  build-linux:
    name: Ejecutables Linux
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Dependencias de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dev zip

      - name: Instalar paquete y PyInstaller
        run: pip install -e ".[dev,build,docs]"

      - name: Stampar commit hash
        run: |
          HASH=$(git rev-parse --short HEAD)
          sed -i "s/__commit__ =.*/__commit__ = \"$HASH\"/" src/ruidaqan/__init__.py

      - name: Generar documentación y copiar al paquete
        run: |
          sphinx-build docs docs/_build/html
          mkdir -p src/ruidaqan/docs/html
          cp -r docs/_build/html/* src/ruidaqan/docs/html/

      - name: Generar ejecutables
        env:
          RUIDAQAN_DEBUG_MODE: "True"
        run: |
          make -f pyinstaller/Makefile.exe exe_procesamiento
          make -f pyinstaller/Makefile.exe exe_resultados
          make -f pyinstaller/Makefile.exe exe_adquisicion

      - name: Comprimir
        run: |
          cd dist
          zip -r ruidaqan-adquisicion-linux.zip   ruidaqan-adquisicion/
          zip -r ruidaqan-procesamiento-linux.zip  ruidaqan-procesamiento/
          zip -r ruidaqan-resultados-linux.zip     ruidaqan-resultados/

      - name: Subir artefactos Linux
        uses: actions/upload-artifact@v4
        with:
          name: executables-linux
          path: dist/*.zip

  # ── 4. Ejecutables Windows ───────────────────────────────────────────────
  build-windows:
    name: Ejecutables Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar paquete y PyInstaller
        run: pip install -e ".[dev,build,docs]"

      - name: Stampar commit hash
        shell: pwsh
        run: |
          $HASH = git rev-parse --short HEAD
          (Get-Content src\ruidaqan\__init__.py) -replace '^__commit__ =.*', "__commit__ = `"$HASH`"" | Set-Content src\ruidaqan\__init__.py

      - name: Generar documentación y copiar al paquete
        shell: pwsh
        run: |
          sphinx-build docs docs/_build/html
          New-Item -ItemType Directory -Force -Path src\ruidaqan\docs\html
          xcopy /E /I /Y docs\_build\html\* src\ruidaqan\docs\html\

      - name: Generar ejecutables
        run: |
          pyinstaller pyinstaller/specs/ruidaqan_procesamiento.spec --noconfirm
          pyinstaller pyinstaller/specs/ruidaqan_resultados.spec --noconfirm
          pyinstaller pyinstaller/specs/ruidaqan_adquisicion.spec --noconfirm

      - name: Comprimir
        shell: pwsh
        run: |
          cd dist
          Compress-Archive -Path ruidaqan-adquisicion   -DestinationPath ruidaqan-adquisicion-windows.zip
          Compress-Archive -Path ruidaqan-procesamiento -DestinationPath ruidaqan-procesamiento-windows.zip
          Compress-Archive -Path ruidaqan-resultados    -DestinationPath ruidaqan-resultados-windows.zip

      - name: Subir artefactos Windows
        uses: actions/upload-artifact@v4
        with:
          name: executables-windows
          path: dist/*.zip

  # ── 5. Publicar en TestPyPI ──────────────────────────────────────────────
  publish-pypi:
    name: Publicar en TestPyPI
    needs: build-wheel
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Descargar wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist/

      - name: Publicar en TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # ── 6. GitHub Release ────────────────────────────────────────────────────
  release:
    name: Crear GitHub Release
    needs: [build-wheel, build-linux, build-windows, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          name: "ruidaqan ${{ github.ref_name }}"
          generate_release_notes: true
          files: artifacts/**/*

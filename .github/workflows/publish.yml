name: Publicar release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Tests pre-publicación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        env:
          RUIDAQAN_DEBUG_MODE: "True"
        run: pytest --tb=short -q

  build-wheel:
    name: Build wheel y sdist
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Instalar herramientas
        run: pip install build sphinx sphinx-design pydata-sphinx-theme tomli
      - name: Build y Docs
        run: |
          pip install -e .
          # Sphinx leerá el hash solo gracias al fetch-depth: 0
          sphinx-build docs docs/_build/html
          mkdir -p src/ruidaqan/docs/
          cp -r docs/_build/html/* src/ruidaqan/docs/
          python -m build
      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/

  build-linux:
    name: Ejecutables Linux
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dependencias de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dev zip
      - name: Build
        run: |
          pip install -e ".[dev,docs]"
          pip install pyinstaller
          sphinx-build docs docs/_build/html
          cp -r docs/_build/html/* src/ruidaqan/docs/
          make -f pyinstaller/Makefile.exe exe_procesamiento
          make -f pyinstaller/Makefile.exe exe_resultados
          make -f pyinstaller/Makefile.exe exe_adquisicion
      - name: Comprimir
        run: |
          cd dist
          zip -r ruidaqan-linux.zip ruidaqan-*/
      - name: Subir Linux
        uses: actions/upload-artifact@v4
        with:
          name: executables-linux
          path: dist/*.zip

  build-windows:
    name: Ejecutables Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        run: |
          pip install -e ".[dev,docs]"
          pip install pyinstaller
          sphinx-build docs docs/_build/html
          xcopy /E /I docs\_build\html src\ruidaqan\docs\html
          pyinstaller pyinstaller/specs/ruidaqan_procesamiento.spec --noconfirm
          pyinstaller pyinstaller/specs/ruidaqan_resultados.spec --noconfirm
          pyinstaller pyinstaller/specs/ruidaqan_adquisicion.spec --noconfirm
      - name: Comprimir
        shell: pwsh
        run: |
          cd dist
          Compress-Archive -Path ruidaqan-* -DestinationPath ruidaqan-windows.zip
      - name: Subir Windows
        uses: actions/upload-artifact@v4
        with:
          name: executables-windows
          path: dist/*.zip

  publish-pypi:
    needs: build-wheel
    runs-on: ubuntu-latest
    permissions: {id-token: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: wheel, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: {repository-url: https://test.pypi.org/legacy/}

  release:
    needs: [build-wheel, build-linux, build-windows, publish-pypi]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {path: artifacts/}
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*

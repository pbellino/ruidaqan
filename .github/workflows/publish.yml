name: Publicar en PyPI

# Se dispara únicamente cuando se pushea un tag de versión, ej: v0.1.0
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  # ── 1. Correr CI completo antes de publicar ──────────────────────────────
  test:
    name: Tests pre-publicación
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar dependencias de desarrollo
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Tests
        env:
          RUIDAQAN_DEBUG_MODE: "True"
        run: pytest --tb=short -q

  # ── 2. Build del paquete ─────────────────────────────────────────────────
  build:
    name: Build wheel y sdist
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar build
        run: pip install build

      - name: Verificar que el tag coincide con la versión del paquete
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"          # quita la "v" inicial
          PKG_VERSION=$(python -c "import tomllib; f=open('pyproject.toml','rb'); d=tomllib.load(f); print(d['project']['version'])")
          echo "Tag: $TAG_VERSION  |  pyproject.toml: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: el tag ($TAG_VERSION) no coincide con la versión del paquete ($PKG_VERSION)"
            exit 1
          fi

      - name: Stampar commit hash en __init__.py
        run: |
          HASH=$(git rev-parse HEAD)
          sed -i "s/__commit__ =.*/__commit__ = \"$HASH\"/" src/ruidaqan/__init__.py

      - name: Construir paquete
        run: python -m build

      - name: Verificar integridad del paquete (twine check)
        run: |
          pip install twine
          twine check dist/*

      - name: Subir artefactos de build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── 3. Publicar en PyPI ──────────────────────────────────────────────────
  publish:
    name: Publicar en PyPI
    needs: build
    runs-on: ubuntu-latest

    # Requiere configurar el entorno "pypi" en GitHub → Settings → Environments
    # y agregar el secret PYPI_API_TOKEN con el token de PyPI.
    environment: pypi

    permissions:
      id-token: write   # Para OIDC trusted publishing (recomendado sobre API token)

    steps:
      - name: Descargar artefactos de build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publicar en PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Opción A (recomendada): Trusted Publishing (sin secrets)
        # Configurar en https://pypi.org/manage/project/ruidaqan/settings/publishing/
        #
        # Opción B: con API token (descomentar si no usás Trusted Publishing)
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}

  # ── 4. Crear GitHub Release con los artefactos ───────────────────────────
  release:
    name: Crear GitHub Release
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Descargar artefactos de build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Crear Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          name: "ruidaqan ${{ github.ref_name }}"

[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ruidaqan" = [
    "docs/**/*",
    "constants/*.py",
]

[project]
name        = "ruidaqan"
version     = "0.0.2"
description = "Adquisición y procesamiento para ruido neutrónico"
readme      = "README.rst"
authors     = [{ name = "Pablo Bellino", email = "pbellino@cnea.gov.ar" }]
license     = { file = "LICENSE" }
keywords    = ["neutron noise", "nidaqmx", "power calibration", "reactor"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"

dependencies = [
    "asteval>=0.9.25",
    "lmfit>=1.0.3",
    "matplotlib>=3.5.1",
    "nidaqmx>=0.5.8",
    "numexpr>=2.8.1",
    "numpy>=1.22.1",
    "pandas>=1.3.5",
    "Pillow>=9.0.0",
    "PyQt6>=6.4.0",
    "PyQt6-Qt6>=6.4.0",
    "PyQt6-WebEngine>=6.4.0",
    "PyQt6-sip>=13.4.0",
    "pyqtgraph>=0.11.1",
    "scipy>=1.7.3",
    "seaborn>=0.11.2",
    "tables>=3.6.1",
    "tomli>=2.0.1",
    "uncertainties>=3.1.6,<3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]
build = [
    "build",
    "bumpver",
    "twine",
    "sphinx>=5.3.0",
    "sphinx-design>=0.3.0",
    "pydata-sphinx-theme",
]

[project.gui-scripts]
ruidaqan = "ruidaqan.__main__:main"

[project.urls]
Repository = "https://github.com/pbellino/ruidaqan"

# ---------------------------------------------------------------------------
# Herramientas
# ---------------------------------------------------------------------------

[tool.bumpver]
current_version = "0.0.2"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message  = "bump version {old_version} -> {new_version}"
commit = true
tag    = true
push   = false

[tool.bumpver.file_patterns]
"pyproject.toml"            = ['version = "{version}"', 'current_version = "{version}"']
"README.rst"                = ["{version}"]
"src/ruidaqan/__init__.py"  = ["{version}"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
